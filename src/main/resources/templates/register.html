<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Registration - Digital Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {

            width: 400px;
            max-width: 90%;

            margin: 60px auto;

            padding: 30px;

            background: white;

            border-radius: 10px;

            box-shadow: 0 0 10px #aaa;
        }

        h2 {

            text-align: center;

            color: #1976d2;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-top: 12px;

            margin-bottom: 5px;

            font-weight: bold;

            color: #333;
        }

        input {

            width: 100%;

            padding: 11px;

            margin-bottom: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #1976d2;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            background: #1976d2;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        button:hover {

            background: #125ca3;
        }

        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;

            text-align: center;
        }

        .login {

            text-align: center;

            margin-top: 20px;

            color: #555;
        }

        .login a {

            color: #1976d2;

            text-decoration: none;

            font-weight: bold;
        }

        .login a:hover {

            text-decoration: underline;
        }

        .role-info {

            background: #e3f2fd;

            color: #1565c0;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;

            font-size: 14px;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="container">


    <h2>
        User Registration
    </h2>


    <!-- ERROR -->

    <div
        class="error"
        th:if="${error}"
        th:text="${error}">

        Registration Error

    </div>


    <!-- INFORMATION -->

    <div class="role-info">

        New accounts are registered as
        <strong>User</strong>.

    </div>


    <!-- REGISTRATION FORM -->

    <form
        action="/register"
        method="post">


        <!-- USERNAME -->

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>


        <!-- EMAIL -->

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required>


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>


        <!-- REGISTER -->

        <button
            type="submit">

            Register

        </button>


    </form>


    <!-- LOGIN -->

    <div class="login">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>


</div>


</body>

</html>
