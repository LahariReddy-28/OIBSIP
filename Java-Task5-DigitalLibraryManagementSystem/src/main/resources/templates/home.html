<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0d47a1;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #1976d2;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Digital Library</h1>
    <p>Edit Book</p>
</header>

<div class="container">

    <h2>Edit Book</h2>

    <form
        th:action="@{/admin/books/save}"
        th:object="${book}"
        method="post">

        <input
            type="hidden"
            th:field="*{id}">


        <label>Book Title</label>

        <input
            type="text"
            th:field="*{title}"
            required>


        <label>Author</label>

        <input
            type="text"
            th:field="*{author}"
            required>


        <label>ISBN</label>

        <input
            type="text"
            th:field="*{isbn}"
            required>


        <label>Category</label>

        <input
            type="text"
            th:field="*{category}"
            required>


        <label>Total Quantity</label>

        <input
            type="number"
            th:field="*{quantity}"
            min="1"
            required>


        <label>Available Quantity</label>

        <input
            type="number"
            th:field="*{availableQuantity}"
            min="0"
            required>


        <button type="submit">
            Update Book
        </button>

    </form>

    <a class="back" href="/admin/books">
        ← Back to Books
    </a>

</div>

</body>
</html>
