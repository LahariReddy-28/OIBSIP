<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            background: #1976d2;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
        }

        .header p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* =========================
           CONTAINER
           ========================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        /* =========================
           CARD
           ========================= */

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            overflow-x: auto;
        }

        .card h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* =========================
           TABLE
           ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f9ff;
        }

        /* =========================
           STATUS
           ========================= */

        .borrowed {
            color: #ef6c00;
            font-weight: bold;
        }

        .returned {
            color: #2e7d32;
            font-weight: bold;
        }

        /* =========================
           EMPTY MESSAGE
           ========================= */

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 18px;
        }

        /* =========================
           BUTTON
           ========================= */

        .actions {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #555;
            color: white;
            padding: 13px 25px;
            border-radius: 7px;
            font-size: 16px;
        }

        .btn:hover {
            background: #333;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .header h1 {
                font-size: 28px;
            }

            .container {
                width: 95%;
            }

            .card {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <h1>Digital Library</h1>

    <p>
        My Bookings
    </p>

</div>


<!-- =========================
     MAIN
     ========================= -->

<div class="container">

    <div class="card">

        <h2>
            Booking History
        </h2>


        <!-- =========================
             BOOKINGS TABLE
             ========================= -->

        <table>

            <thead>

            <tr>

                <th>Book</th>

                <th>Author</th>

                <th>Borrow Date</th>

                <th>Return Date</th>

                <th>Status</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="booking : ${bookings}">

                <!-- BOOK -->

                <td>

                    <span th:if="${booking.book != null}"
                          th:text="${booking.book.title}">
                        Book
                    </span>

                    <span th:if="${booking.book == null}">
                        Unknown
                    </span>

                </td>


                <!-- AUTHOR -->

                <td>

                    <span th:if="${booking.book != null}"
                          th:text="${booking.book.author}">
                        Author
                    </span>

                    <span th:if="${booking.book == null}">
                        Unknown
                    </span>

                </td>


                <!-- BORROW DATE -->

                <td>

                    <span th:if="${booking.borrowDate != null}"
                          th:text="${booking.borrowDate}">
                        -
                    </span>

                    <span th:if="${booking.borrowDate == null}">
                        -
                    </span>

                </td>


                <!-- RETURN DATE -->

                <td>

                    <span th:if="${booking.returnDate != null}"
                          th:text="${booking.returnDate}">
                        -
                    </span>

                    <span th:if="${booking.returnDate == null}">
                        Not Returned
                    </span>

                </td>


                <!-- STATUS -->

                <td>

                    <span th:if="${booking.status == 'BORROWED'}"
                          class="borrowed">

                        BORROWED

                    </span>

                    <span th:if="${booking.status == 'RETURNED'}"
                          class="returned">

                        RETURNED

                    </span>

                    <span th:if="${booking.status != 'BORROWED'
                                  and booking.status != 'RETURNED'}"
                          th:text="${booking.status}">

                        -

                    </span>

                </td>

            </tr>


            <!-- =========================
                 NO BOOKINGS
                 ========================= -->

            <tr th:if="${#lists.isEmpty(bookings)}">

                <td colspan="5">

                    <div class="empty">

                        📚 You don't have any bookings yet.

                    </div>

                </td>

            </tr>


            </tbody>

        </table>

    </div>


    <!-- =========================
         BACK BUTTON
         ========================= -->

    <div class="actions">

        <a th:href="@{/dashboard(username=${username})}"
           class="btn">

            ← Back to Dashboard

        </a>

    </div>

</div>


</body>

</html>
