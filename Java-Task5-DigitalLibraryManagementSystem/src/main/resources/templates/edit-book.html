<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Book | Digital Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            color: #263238;
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #1565c0, #1976d2);

            color: white;

            padding: 22px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .admin-label {
            background: rgba(255,255,255,0.18);

            padding: 9px 16px;

            border-radius: 20px;

            font-size: 14px;
        }

        /* ================= MAIN ================= */

        .container {
            width: 92%;
            max-width: 700px;
            margin: 45px auto;
        }

        /* ================= CARD ================= */

        .form-card {
            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.10);
        }

        .form-header {
            text-align: center;

            margin-bottom: 30px;
        }

        .book-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #fff3e0;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .form-header h2 {
            margin: 0;

            color: #1565c0;

            font-size: 28px;
        }

        .form-header p {
            margin-top: 8px;

            color: #78909c;
        }

        /* ================= ERROR ================= */

        .error {
            background: #ffebee;

            color: #c62828;

            border-left: 5px solid #e53935;

            padding: 13px 15px;

            border-radius: 8px;

            margin-bottom: 22px;

            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #37474f;
        }

        .required {
            color: #e53935;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cfd8dc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #1976d2;

            box-shadow:
                0 0 0 3px rgba(25,118,210,0.12);
        }

        /* ================= TWO COLUMNS ================= */

        .row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        /* ================= AVAILABILITY ================= */

        .availability-box {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin: 5px 0 25px;
        }

        .availability-item {
            padding: 15px;

            border-radius: 10px;

            text-align: center;

            background: #f5f7fa;

            border: 1px solid #e0e0e0;
        }

        .availability-item span {
            display: block;

            color: #78909c;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .availability-item strong {
            font-size: 24px;

            color: #1565c0;
        }

        /* ================= BUTTONS ================= */

        .button-group {
            display: flex;

            gap: 12px;

            margin-top: 28px;
        }

        .btn {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            text-align: center;

            text-decoration: none;
        }

        .update-btn {
            background: linear-gradient(
                135deg,
                #1976d2,
                #1565c0
            );

            color: white;
        }

        .update-btn:hover {
            background: #0d47a1;
        }

        .cancel-btn {
            background: #eceff1;

            color: #455a64;
        }

        .cancel-btn:hover {
            background: #cfd8dc;
        }

        /* ================= INFO ================= */

        .info-box {
            margin-top: 25px;

            padding: 15px;

            background: #fff8e1;

            border-radius: 8px;

            border-left: 4px solid #ffb300;

            color: #6d4c41;

            font-size: 13px;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            margin: 25px 0 35px;

            color: #90a4ae;

            font-size: 13px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 650px) {

            header {
                padding: 18px 20px;

                flex-direction: column;

                gap: 10px;

                text-align: center;
            }

            header h1 {
                font-size: 21px;
            }

            .container {
                width: 94%;

                margin: 25px auto;
            }

            .form-card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .availability-box {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <h1>
        📚 Digital Library
    </h1>

    <div class="admin-label">
        🔐 Administrator
    </div>

</header>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="form-card">


        <!-- HEADER -->

        <div class="form-header">

            <div class="book-icon">
                ✏️
            </div>

            <h2>
                Edit Book
            </h2>

            <p>
                Update the information of this library book.
            </p>

        </div>


        <!-- ERROR -->

        <div
            class="error"
            th:if="${error}"
            th:text="${error}">

            Error message

        </div>


        <!-- CURRENT AVAILABILITY -->

        <div class="availability-box">

            <div class="availability-item">

                <span>
                    Total Copies
                </span>

                <strong
                    th:text="${book.quantity}">

                    0

                </strong>

            </div>


            <div class="availability-item">

                <span>
                    Available Copies
                </span>

                <strong
                    th:text="${book.availableQuantity}">

                    0

                </strong>

            </div>

        </div>


        <!-- FORM -->

        <form
            th:action="@{/admin/books/update}"
            method="post">


            <!-- ID -->

            <input
                type="hidden"
                name="id"
                th:value="${book.id}">


            <!-- TITLE -->

            <div class="form-group">

                <label>
                    Book Title
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="title"
                    th:value="${book.title}"
                    maxlength="150"
                    required>

            </div>


            <!-- AUTHOR -->

            <div class="form-group">

                <label>
                    Author
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="author"
                    th:value="${book.author}"
                    maxlength="100"
                    required>

            </div>


            <!-- ISBN + CATEGORY -->

            <div class="row">


                <div class="form-group">

                    <label>
                        ISBN
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="isbn"
                        th:value="${book.isbn}"
                        maxlength="30"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Category
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="category"
                        th:value="${book.category}"
                        maxlength="60"
                        required>

                </div>


            </div>


            <!-- QUANTITY -->

            <div class="form-group">

                <label>
                    Total Quantity
                    <span class="required">*</span>
                </label>

                <input
                    type="number"
                    name="quantity"
                    min="1"
                    max="10000"
                    th:value="${book.quantity}"
                    required>

            </div>


            <!-- BUTTONS -->

            <div class="button-group">


                <a
                    href="/admin/books"
                    class="btn cancel-btn">

                    ← Cancel

                </a>


                <button
                    type="submit"
                    class="btn update-btn">

                    💾 Update Book

                </button>


            </div>


        </form>


        <!-- INFO -->

        <div class="info-box">

            ⚠️ <strong>Important:</strong>
            The total quantity cannot be reduced below the
            number of copies currently borrowed.

        </div>


    </div>


</div>


<footer>

    Digital Library Management System © 2026

</footer>


</body>

</html>
