<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Library Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 400px;
            max-width: 90%;

            margin: 80px auto;

            padding: 30px;

            background: white;

            border-radius: 10px;

            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            text-align: center;
            color: #1976d2;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 12px;
            margin-bottom: 5px;

            font-weight: bold;

            color: #333;
        }

        input,
        select {

            width: 100%;

            padding: 11px;

            margin-bottom: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        input:focus,
        select:focus {

            border-color: #1976d2;

            outline: none;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            background: #1976d2;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        button:hover {

            background: #125ca3;
        }

        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;

            text-align: center;
        }

        .success {

            background: #d4edda;

            color: #155724;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 15px;

            text-align: center;
        }

        .register {

            text-align: center;

            margin-top: 20px;

            color: #555;
        }

        .register a {

            color: #1976d2;

            text-decoration: none;

            font-weight: bold;
        }

        .register a:hover {

            text-decoration: underline;
        }

        .role-info {

            font-size: 13px;

            color: #777;

            margin-top: -5px;

            margin-bottom: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>
        Digital Library Login
    </h2>


    <!-- ============================== -->
    <!-- ERROR -->
    <!-- ============================== -->

    <div
        class="error"
        th:if="${error}"
        th:text="${error}">

        Login Error

    </div>


    <!-- ============================== -->
    <!-- SUCCESS -->
    <!-- ============================== -->

    <div
        class="success"
        th:if="${success}"
        th:text="${success}">

        Success

    </div>


    <!-- ============================== -->
    <!-- LOGIN FORM -->
    <!-- ============================== -->

    <form
        action="/login"
        method="post">


        <!-- USERNAME -->

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>


        <!-- ROLE -->

        <label>
            Login As
        </label>

        <select
            name="role"
            required>

            <option value="">
                -- Select Role --
            </option>

            <option value="USER">
                User
            </option>

            <option value="ADMIN">
                Admin
            </option>

        </select>

        <div class="role-info">
            Select the role associated with your account.
        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit">

            Login

        </button>

    </form>


    <!-- ============================== -->
    <!-- REGISTER -->
    <!-- ============================== -->

    <div class="register">

        New user?

        <a href="/register">
            Create Account
        </a>

    </div>

</div>

</body>

</html>
