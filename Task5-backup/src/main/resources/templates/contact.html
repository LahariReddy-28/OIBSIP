<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Digital Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #1976d2;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;

            padding: 13px;

            background: #1976d2;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }

        .submit-btn:hover {
            background: #125ca3;
        }

        .navigation {
            text-align: center;
            margin-top: 25px;
        }

        .navigation a {
            display: inline-block;

            padding: 10px 18px;

            margin: 5px;

            background: #555;

            color: white;

            text-decoration: none;

            border-radius: 6px;
        }

        .navigation a:hover {
            background: #333;
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .card {
                padding: 20px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>
        Digital Library
    </h1>

    <div>

        Welcome,

        <strong th:text="${username}">
            User
        </strong>

    </div>

</header>


<div class="container">


    <div class="card">

        <h2>
            📩 Contact / Query
        </h2>

        <p class="description">
            Have a question or problem?
            Send a message to the library administrator.
        </p>


        <!-- SUCCESS -->

        <div
            class="message success"
            th:if="${success}"
            th:text="${success}">

            Success

        </div>


        <!-- ERROR -->

        <div
            class="message error"
            th:if="${error}"
            th:text="${error}">

            Error

        </div>


        <!-- FORM -->

        <form
            th:action="@{/contact/submit}"
            method="post">


            <input
                type="hidden"
                name="username"
                th:value="${username}">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label>
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    placeholder="Enter subject"
                    required>

            </div>


            <!-- MESSAGE -->

            <div class="form-group">

                <label>
                    Message
                </label>

                <textarea
                    name="message"
                    placeholder="Enter your query..."
                    required></textarea>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn">

                📩 Submit Query

            </button>


        </form>


    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <a
            th:href="@{/dashboard(username=${username})}">

            🏠 Dashboard

        </a>


        <a
            th:href="@{/books(username=${username})}">

            📚 Books

        </a>


        <a
            th:href="@{/reservations(username=${username})}">

            📅 Reservations

        </a>


        <a
            th:href="@{/fines(username=${username})}">

            💰 Fines

        </a>

    </div>


</div>


</body>

</html>
